<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QuickFocus Pro</title>
    <style>
        body { width: 320px; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 16px; background: #0b0f19; color: #f8fafc; box-sizing: border-box; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .header h1 { font-size: 16px; margin: 0; color: #818cf8; }
        .badge { font-size: 11px; background: rgba(99,102,241,0.2); color: #818cf8; padding: 2px 8px; border-radius: 12px; }
        .modes { display: flex; gap: 4px; background: #1e293b; padding: 4px; border-radius: 10px; margin-bottom: 14px; }
        .mode-btn { flex: 1; background: transparent; border: none; color: #94a3b8; font-size: 11px; font-weight: 600; padding: 6px 0; border-radius: 6px; cursor: pointer; }
        .mode-btn.active { background: #6366f1; color: white; }
        .timer-card { background: #1e293b; padding: 18px; border-radius: 14px; text-align: center; margin-bottom: 16px; }
        #timer-display { font-size: 40px; font-weight: 800; margin-bottom: 12px; }
        .timer-controls { display: flex; gap: 8px; justify-content: center; }
        .btn { border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer; }
        .btn-primary { background: #6366f1; color: white; }
        .btn-secondary { background: #334155; color: white; }
        .task-input-group { display: flex; gap: 6px; margin-bottom: 10px; }
        .task-input-group input { flex: 1; background: #1e293b; border: 1px solid #334155; padding: 8px; border-radius: 8px; color: white; font-size: 12px; }
        .task-input-group button { background: #10b981; color: white; border: none; width: 32px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        ul { list-style: none; padding: 0; margin: 0; max-height: 140px; overflow-y: auto; }
        .task-item { background: #1e293b; padding: 8px 10px; border-radius: 8px; margin-bottom: 6px; display: flex; justify-content: space-between; font-size: 12px; }
        .completed { text-decoration: line-through; color: #94a3b8; }
        .task-actions button { background: none; border: none; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚡ QuickFocus Pro</h1>
        <span class="badge" id="completed-count">Done: 0</span>
    </div>
    <div class="modes">
        <button class="mode-btn active" id="m1">Pomodoro</button>
        <button class="mode-btn" id="m2">Short Break</button>
        <button class="mode-btn" id="m3">Long Break</button>
    </div>
    <div class="timer-card">
        <div id="timer-display">25:00</div>
        <div class="timer-controls">
            <button class="btn btn-primary" id="start-btn">Start</button>
            <button class="btn btn-secondary" id="reset-btn">Reset</button>
        </div>
    </div>
    <div class="task-input-group">
        <input type="text" id="task-input" placeholder="Add a new task...">
        <button id="add-btn">+</button>
    </div>
    <ul id="task-list"></ul>
    <script src="popup.js"></script>
</body>
</html>
